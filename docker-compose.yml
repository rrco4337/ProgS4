services:
  # Azure SQL Edge — compatible T-SQL, nécessite ~1 Go RAM (vs 2 Go pour SQL Server)
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    command: ["/bin/bash", "/docker-entrypoint-initdb.d/entrypoint.sh"]
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=MotDePasseFort123!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "MotDePasseFort123!" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sqlserver_data:
    driver: local
